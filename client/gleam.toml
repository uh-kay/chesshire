name = "client"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
modem = ">= 2.1.3 and < 3.0.0"
shared = { path = "../shared" }
rsvp = ">= 2.0.0 and < 3.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
plinth = ">= 0.10.2 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = { git = "https://github.com/uh-kay/dev-tools", ref = "main" }

[tools.lustre.dev]
host = "0.0.0.0"
proxy = { from = "/v1", to = "http://localhost:8000/v1" }

[tools.lustre.build]
no_html = true
outdir = "../server/priv/static"
minify = true

[tools.lustre.html]
links = [
    { rel = "preconnect", href = "https://fonts.googleapis.com" },
    { rel = "preconnect", href = "https://fonts.gstatic.com", crossorigin = "anonymous"},
]
stylesheets = [
    { href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" },
]
